[package]
name = "terraforge"
version = "0.1.0"
edition = "2021"
description = "Terraforge - a Terraria-inspired 2D sandbox adventure, written in Rust and compiled to WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
